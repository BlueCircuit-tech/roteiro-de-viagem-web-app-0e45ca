<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trilhário — Roteiros de Viagem</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        marinho: {
          DEFAULT: '#1E3A5F',
          900: '#14263e',
          800: '#1E3A5F',
          700: '#2a4d78',
          600: '#3a6394'
        },
        azul: {
          DEFAULT: '#2563EB',
          600: '#2563EB',
          500: '#4a7ef0',
          400: '#7ba3f5',
          100: '#dbe6fd',
          50: '#eef3fe'
        },
        nevoa: {
          DEFAULT: '#F8FAFC',
          200: '#e8edf3',
          300: '#d3dbe4',
          500: '#8b9aad'
        }
      },
      fontFamily: {
        sans: ['Outfit', 'sans-serif'],
        display: ['Fraunces', 'serif']
      },
      boxShadow: {
        suave: '0 1px 2px rgba(30,58,95,.06), 0 8px 24px -12px rgba(30,58,95,.18)'
      }
    }
  }
}
</script>
<style>
  html, body { -webkit-tap-highlight-color: transparent; }
  body {
    background: #eef1f5;
  }
  #aparelho {
    background: #F8FAFC;
  }
  main { padding-bottom: 92px; }
  [data-nav] {
    color: #8b9aad;
    transition: color .18s ease, background .18s ease;
  }
  [data-nav] svg { transition: transform .18s ease; }
  [data-nav].ativo {
    color: #2563EB;
  }
  [data-nav].ativo .pill {
    background: #dbe6fd;
  }
  [data-nav].ativo svg { transform: translateY(-1px); }
  .pill {
    background: transparent;
    border-radius: 999px;
    padding: 5px 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #barra-nav {
    scrollbar-width: none;
  }
  #barra-nav::-webkit-scrollbar { display: none; }
  ::selection { background: #dbe6fd; }
</style>
</head>
<body class="font-sans text-marinho antialiased">

<div id="aparelho" class="relative mx-auto w-full max-w-[430px] min-h-screen shadow-[0_0_60px_-20px_rgba(30,58,95,.35)]">

  <main class="min-h-screen">
    <!-- TELAS -->
  </main>

  <nav id="barra-nav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] z-40 bg-white/95 backdrop-blur border-t border-nevoa-200">
    <div class="flex items-stretch justify-between px-1.5 py-2 gap-0.5 overflow-x-auto">

      <button data-nav="meus-roteiros" onclick="mostrarTela('meus-roteiros')" class="flex-1 min-w-[54px] flex flex-col items-center gap-1 py-1">
        <span class="pill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10l2 2h6.5A1.5 1.5 0 0 1 20 7.5v11A1.5 1.5 0 0 1 18.5 20h-13A1.5 1.5 0 0 1 4 18.5z"/><path d="M8 12h8M8 16h5"/></svg>
        </span>
        <span class="text-[9.5px] font-medium tracking-tight leading-none">Roteiros</span>
      </button>

      <button data-nav="detalhes-do-roteiro" onclick="mostrarTela('detalhes-do-roteiro')" class="flex-1 min-w-[54px] flex flex-col items-center gap-1 py-1">
        <span class="pill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="2.2"/><path d="M8 3v3M16 3v3M3.5 9.5h17M7.5 13.5h3M7.5 17h6"/></svg>
        </span>
        <span class="text-[9.5px] font-medium tracking-tight leading-none">Detalhes</span>
      </button>

      <button data-nav="mapa-da-viagem" onclick="mostrarTela('mapa-da-viagem')" class="flex-1 min-w-[54px] flex flex-col items-center gap-1 py-1">
        <span class="pill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s6.5-6.1 6.5-11a6.5 6.5 0 1 0-13 0C5.5 14.9 12 21 12 21z"/><circle cx="12" cy="10" r="2.4"/></svg>
        </span>
        <span class="text-[9.5px] font-medium tracking-tight leading-none">Mapa</span>
      </button>

      <button data-nav="fotos-e-documentos" onclick="mostrarTela('fotos-e-documentos')" class="flex-1 min-w-[54px] flex flex-col items-center gap-1 py-1">
        <span class="pill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2.2"/><path d="M8 6l1.6-2.5h4.8L16 6"/><circle cx="12" cy="13" r="3.2"/></svg>
        </span>
        <span class="text-[9.5px] font-medium tracking-tight leading-none">Arquivos</span>
      </button>

      <button data-nav="compartilhar-roteiro" onclick="mostrarTela('compartilhar-roteiro')" class="flex-1 min-w-[54px] flex flex-col items-center gap-1 py-1">
        <span class="pill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5.5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="18.5" r="2.6"/><path d="M15.7 6.8 8.3 10.7M8.3 13.3l7.4 3.9"/></svg>
        </span>
        <span class="text-[9.5px] font-medium tracking-tight leading-none">Convidar</span>
      </button>

      <button data-nav="perfil-do-viajante" onclick="mostrarTela('perfil-do-viajante')" class="flex-1 min-w-[54px] flex flex-col items-center gap-1 py-1">
        <span class="pill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c.7-3.6 3.6-5.6 7.2-5.6s6.5 2 7.2 5.6"/></svg>
        </span>
        <span class="text-[9.5px] font-medium tracking-tight leading-none">Perfil</span>
      </button>

    </div>
  </nav>

</div>

<script>
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0 });
    }
    document.addEventListener('DOMContentLoaded', function () {
      mostrarTela('meus-roteiros');
    });
</script>
</body>
</html>
